<div class="login-container">
  <mat-card class="login-card">
    <mat-card-content>
      <div class="login-logo">
        <mat-icon class="logo-icon">lock_reset</mat-icon>
        <h1>Reset Password</h1>
      </div>

      <ng-container *ngIf="!sent; else sentTpl">
        <p class="hint">{{ 'FORGOT_PASSWORD.SUBTITLE' | translate }}</p>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>{{ 'FORGOT_PASSWORD.EMAIL' | translate }}</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email">
            <mat-error>{{ 'FORGOT_PASSWORD.INVALID_EMAIL' | translate }}</mat-error>
          </mat-form-field>

          <div *ngIf="error" class="error-msg">{{error}}</div>

          <button mat-raised-button color="primary" type="submit" class="full-width login-btn" [disabled]="loading">
            <mat-spinner *ngIf="loading" diameter="20" style="display:inline-block;margin-right:8px"></mat-spinner>
            Invia
          </button>
        </form>
      </ng-container>

      <ng-template #sentTpl>
        <p class="success-msg">{{ 'FORGOT_PASSWORD.SUCCESS' | translate }}</p>
      </ng-template>

      <div class="forgot-link">
        <a routerLink="/login">{{ 'FORGOT_PASSWORD.BACK_LOGIN' | translate }}</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
