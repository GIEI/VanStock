<div class="login-bg">
  <mat-card class="login-card">
    <mat-card-content>

      <div class="login-logo">
        <div class="logo-mark"><mat-icon>inventory</mat-icon></div>
        <h1>VanStock</h1>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="form-wrap">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'LOGIN.EMAIL' | translate }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          <mat-error>{{ 'LOGIN.INVALID_EMAIL' | translate }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'LOGIN.PASSWORD' | translate }}</mat-label>
          <input matInput [type]="hidePass ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePass = !hidePass">
            <mat-icon>{{hidePass ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error>{{ 'LOGIN.REQUIRED' | translate }}</mat-error>
        </mat-form-field>

        <div *ngIf="error" class="error-banner">
          <mat-icon>error_outline</mat-icon>{{error}}
        </div>

        <button mat-raised-button color="primary" type="submit" class="full-width login-btn" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block;margin-right:8px"></mat-spinner>
          {{ 'LOGIN.SIGN_IN' | translate }}
        </button>
      </form>

      <div class="card-footer">
        <a routerLink="/forgot-password">{{ 'LOGIN.FORGOT_PASSWORD' | translate }}</a>
      </div>

    </mat-card-content>
  </mat-card>
</div>
