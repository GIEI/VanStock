server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Restore di backup (DB e uploads): file potenzialmente grandi, upload lento.
    # Match più specifico di /api/ — viene scelto prima da nginx.
    location /api/backups/ {
        client_max_body_size 500m;
        proxy_pass         http://stocksimple-backend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy API calls to backend
    location /api/ {
        # Lascia spazio ai 2 MB max della foto profilo + overhead multipart
        client_max_body_size 3m;
        proxy_pass         http://stocksimple-backend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Proxy uploaded files — ^~ prevents regex locations from intercepting
    location ^~ /uploads/ {
        proxy_pass         http://stocksimple-backend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        expires            off;
        add_header         Cache-Control "no-cache";
    }

    # Angular PWA — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
