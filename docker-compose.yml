services:
  db:
    image: postgres:16-alpine
    container_name: stocksimple-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stocksimple}
      POSTGRES_USER: ${DB_USER:-stockuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-stockuser} -d ${DB_NAME:-stocksimple}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksimple-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stocksimple}
      DB_USER: ${DB_USER:-stockuser}
      DB_PASSWORD: ${DB_PASSWORD:-stockpass}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DEFAULT_COMPANY_NAME: ${DEFAULT_COMPANY_NAME:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASS: ${DEFAULT_ADMIN_PASS:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - ./db:/db:ro
      - ./data/uploads:/app/uploads
      - ./data/backups:/app/backups
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocksimple-frontend
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  sito_php:
    image: php:8.2-cli-alpine
    container_name: stocksimple-sito
    restart: unless-stopped
    volumes:
      - ./SITOWEB:/app
    working_dir: /app
    command: php -S 0.0.0.0:80
    expose:
      - "80"

volumes:
  postgres_data:
