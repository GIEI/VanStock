name: van_stock
description: "VanStock App - Flutter version"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management & DI ────────────────────────────────────────
  riverpod: 3.2.1
  flutter_riverpod: ^3.3.1

  # ── Navigation ──────────────────────────────────────────────────
  go_router: ^14.0.0

  # ── Networking ──────────────────────────────────────────────────
  dio: ^5.3.0

  # ── Data & Models ───────────────────────────────────────────────
  json_annotation: ^4.11.0

  # ── Firebase & Notifications ────────────────────────────────────
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.0

  # ── UI & Material 3 ─────────────────────────────────────────────
  google_fonts: ^8.0.2

  # ── Storage & Local Data ────────────────────────────────────────
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.1
  local_auth: ^2.3.0
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0

  # ── Utils ───────────────────────────────────────────────────────
  intl: ^0.20.2
  timezone: ^0.9.0
  logger: ^2.1.0
  connectivity_plus: ^7.1.1
  geolocator: ^9.0.2
  uuid: ^4.3.3

  # ── Image Handling ──────────────────────────────────────────────
  image_picker: ^1.0.4
  http: ^1.1.0
  cached_network_image: ^3.4.1

  # ── Camera & QR Code Scanning ────────────────────────────────────
  camera: ^0.10.5+5
  mobile_scanner: ^7.0.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.1
  chewie: ^1.7.1
  video_player: ^2.8.1

  # ── Localization ────────────────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ────────────────────────────────────────────
  build_runner: ^2.13.1
  json_serializable: ^6.13.1

  # ── Testing ────────────────────────────────────────────────────
  mockito: ^5.4.4

  flutter_launcher_icons: ^0.14.3

  # ── Linting & Analysis ─────────────────────────────────────────
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ── Assets ────────────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png"
  web:
    generate: true
    image_path: "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png"
  windows:
    generate: true
    image_path: "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png"
  macos:
    generate: true
    image_path: "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png"
